<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, follow">
    <title>Embracing Digital Transformation</title>
    
    <!-- Direct HTML fallback redirect for AI bots and crawlers -->
    <link rel="canonical" href="https://embracingdigital.org/en/home/">
    <meta http-equiv="refresh" content="0; url=https://embracingdigital.org/en/home/">
</head>
<body>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Get the current URL
        const currentUrl = window.location.href;

        // Match old URL formats (e.g., episode-EDT252-en)
        const oldUrlPattern = /episode-(EDT\d+)-(\w+)/i; 
        const match = currentUrl.match(oldUrlPattern);

        if (match) {
            const episodeId = match[1].toLowerCase(); // e.g., "edt252"
            const language = match[2]; 

            // Convert to new format: edt-252
            const newEpisodeId = episodeId.replace(/(\d+)/, "-$1");

            // Redirect to updated HTTPS episode path
            window.location.href = `https://embracingdigital.org/${language}/episodes/${newEpisodeId}/index.html`;
        } else {
            // Default fallback redirect
            window.location.href = './en/home/';
        }
    });
</script>
<p>Redirecting to <a href="https://embracingdigital.org/en/home/">Embracing Digital Transformation</a>...</p>
</body>
</html>
